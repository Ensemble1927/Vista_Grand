<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 420" fill="none">
  <!-- Outer Arch Contour -->
  <path d="M0,20 C80,20 140,80 140,210 C140,340 80,400 0,400" stroke="#D7A52B" stroke-width="1.2" stroke-opacity="0.45" />
  
  <!-- Inner Dotted Arch Contour -->
  <path d="M0,45 C65,45 115,100 115,210 C115,320 65,375 0,375" stroke="#D7A52B" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3" />
  
  <!-- Third Concentric Contour -->
  <path d="M0,70 C50,70 90,120 90,210 C90,300 50,350 0,350" stroke="#D7A52B" stroke-width="0.8" stroke-opacity="0.25" />

  <!-- Center Sunburst / Mandala Motif -->
  <circle cx="0" cy="210" r="70" stroke="#D7A52B" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="0" cy="210" r="50" stroke="#D7A52B" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="2 2" />
  <circle cx="0" cy="210" r="30" stroke="#D7A52B" stroke-width="1.2" stroke-opacity="0.5" />
  <circle cx="0" cy="210" r="12" fill="#D7A52B" fill-opacity="0.2" stroke="#D7A52B" stroke-width="1" stroke-opacity="0.6" />

  <!-- Radiating Architectural Ray Lines -->
  <line x1="0" y1="210" x2="70" y2="210" stroke="#D7A52B" stroke-width="1.2" stroke-opacity="0.5" />
  <line x1="0" y1="210" x2="60" y2="160" stroke="#D7A52B" stroke-width="0.8" stroke-opacity="0.4" />
  <line x1="0" y1="210" x2="60" y2="260" stroke="#D7A52B" stroke-width="0.8" stroke-opacity="0.4" />
  <line x1="0" y1="210" x2="35" y2="130" stroke="#D7A52B" stroke-width="0.7" stroke-opacity="0.35" />
  <line x1="0" y1="210" x2="35" y2="290" stroke="#D7A52B" stroke-width="0.7" stroke-opacity="0.35" />
  <line x1="0" y1="210" x2="15" y2="105" stroke="#D7A52B" stroke-width="0.6" stroke-opacity="0.3" />
  <line x1="0" y1="210" x2="15" y2="315" stroke="#D7A52B" stroke-width="0.6" stroke-opacity="0.3" />

  <!-- Decorative Accent Diamonds and Dots -->
  <polygon points="68,210 73,205 78,210 73,215" fill="#D7A52B" fill-opacity="0.6" />
  <polygon points="58,160 62,156 66,160 62,164" fill="#D7A52B" fill-opacity="0.5" />
  <polygon points="58,260 62,256 66,260 62,264" fill="#D7A52B" fill-opacity="0.5" />
  <circle cx="34" cy="130" r="2.5" fill="#D7A52B" fill-opacity="0.5" />
  <circle cx="34" cy="290" r="2.5" fill="#D7A52B" fill-opacity="0.5" />
  <circle cx="100" cy="150" r="2" fill="#D7A52B" fill-opacity="0.4" />
  <circle cx="100" cy="270" r="2" fill="#D7A52B" fill-opacity="0.4" />
  <circle cx="125" cy="210" r="3" fill="#D7A52B" fill-opacity="0.5" />

  <!-- Top and Bottom Delicate Finials -->
  <circle cx="0" cy="20" r="4" fill="#D7A52B" fill-opacity="0.5" />
  <circle cx="0" cy="400" r="4" fill="#D7A52B" fill-opacity="0.5" />
</svg>
